name: Daily news digest

# Triggered from cron-job.org (6:00, 13:00, 20:00 IST) through the workflow_dispatch API.
# You can also press "Run workflow" in the Actions tab at any time.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: digest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (article extraction + free text-to-speech voices)
        run: |
          pip install trafilatura || true
          pip install edge-tts || true

      - name: Build digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python news_digest.py --out out --quiet

      - name: Make audio (optional - never fails the build)
        continue-on-error: true
        run: python make_audio.py out/digest.txt out/digest.mp3

      - name: Get the published branch (keeps the 7-day archive)
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add site origin/gh-pages
          else
            mkdir site
          fi

      - name: Update site (add today, delete pages older than 7 days)
        run: python publish.py out/digest.html site out/digest.mp3

      - name: Publish to GitHub Pages
        working-directory: site
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Digest $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages