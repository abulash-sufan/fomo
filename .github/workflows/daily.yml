name: Daily news digest

on:
  schedule:
    # GitHub often starts scheduled jobs 15-60 min late, so these are set ~1h before the time you want.
    - cron: "37 23 * * *"    # 05:07 IST  -> ready by ~6:00
    - cron: "37 5 * * *"     # 11:07 IST  -> ready by ~12:00
    - cron: "37 9 * * *"     # 15:07 IST  -> ready by ~16:00
    - cron: "50 9 * * *"    # TEST ONLY: 15:20 IST. Delete this line after the test.
  workflow_dispatch:          # lets you press "Run workflow" to test

permissions:
  contents: write

concurrency: digest

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (optional better article extraction)
        run: pip install trafilatura || true

      - name: Build digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python news_digest.py --out out --quiet

      - name: Get the published branch (keeps the 7-day archive)
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add site origin/gh-pages
          else
            mkdir site
          fi

      - name: Update site (add today, delete pages older than 7 days)
        run: python publish.py out/digest.html site

      - name: Publish to GitHub Pages
        working-directory: site
        run: |
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Digest $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      - name: Keep the schedule alive (GitHub pauses idle repos after 60 days)
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -ge 23 ]; then
            git config user.name "digest-bot"; git config user.email "digest-bot@users.noreply.github.com"
            git commit --allow-empty -qm "keepalive" && git push || true
          fi